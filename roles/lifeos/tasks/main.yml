---
# LifeOS (formerly PAI).
#
# Upstream renamed danielmiessler/PAI -> danielmiessler/LifeOS and rearchitected
# the install in 7.x. The vendored repo no longer ships a `.claude` tree, so the
# old "symlink ~/.claude at the submodule" model is gone. Instead the payload's
# bun tools COPY the skill library and LIFEOS runtime into the harness config
# root. Every tool is dry-run by default and additive on --apply: existing files
# are never overwritten, which is what makes this role safe to re-run.
#
# Personal content lives in the private notebook repo (scaffolded, then linked
# into the config root) and is deliberately outside this repo. See
# lifeos_config_dir below.

- name: set lifeos facts
  set_fact:
    lifeos_payload: "{{ ansible_env.PWD }}/.vendor/pai/LifeOS"
    lifeos_config_root: "{{ ansible_env.HOME }}/.claude"
    # 2026-08-13: the USER tree moved out of ~/.config/LIFEOS and into the
    # private notebook repo, so personal content rides one repo instead of
    # needing its own sync. Both payload tools take --config-dir, so this is
    # the supported relocation, not a symlink hack.
    lifeos_config_dir: "{{ ansible_env.HOME }}/Projects/notebook/lifeos"
  tags: [lifeos, pai]

# Install Bun on Linux (macOS gets it via Homebrew in the packages role)
- name: check if bun is installed
  shell: command -v bun
  register: lifeos_bun_exists
  ignore_errors: true
  changed_when: false
  tags: [lifeos, pai, bun]

- name: install bun on Linux
  shell: curl -fsSL https://bun.sh/install | bash
  args:
    creates: "{{ ansible_env.HOME }}/.bun/bin/bun"
  when:
    - lifeos_bun_exists is failed
    - ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'
  tags: [lifeos, pai, bun]

# Guard: pre-7.x installs symlinked ~/.claude into the submodule. The installer
# would then write the runtime back into the vendor tree. Fail loudly rather
# than corrupt it — migrating holds live session data and must be done by hand.
- name: stat config root
  stat:
    path: "{{ lifeos_config_root }}"
  register: lifeos_config_root_stat
  tags: [lifeos, pai]

- name: fail if config root is still a pre-7.x symlink
  fail:
    msg: >-
      {{ lifeos_config_root }} is a symlink (legacy PAI layout). LifeOS 7.x needs
      a real directory. Move the live state out of the submodule first:
      rm {{ lifeos_config_root }} && mv .vendor/pai/.claude {{ lifeos_config_root }}
  when: lifeos_config_root_stat.stat.exists and lifeos_config_root_stat.stat.islnk
  tags: [lifeos, pai]

# Three MEMORY subdirs are durable personal content and ride the notebook repo
# alongside USER: KNOWLEDGE, LEARNING, WORK. STATE deliberately stays local --
# it holds healthsync OAuth tokens. OBSERVABILITY, VOICE and SKILLS are
# machine-local telemetry and stay local too.
#
# This MUST run before DeployCore. Its scaffoldMemory() creates these as real
# directories when missing, and ansible's file module cannot convert a directory
# into a symlink. Linking first makes the scaffold a no-op. A dangling link is
# fine here: it just means the notebook repo has not been cloned yet.
- name: ensure memory root exists
  file:
    path: "{{ lifeos_config_root }}/LIFEOS/MEMORY"
    state: directory
    mode: '0755'
  tags: [lifeos, pai]

- name: link durable memory subdirs into config root
  file:
    src: "{{ lifeos_config_dir }}/MEMORY/{{ item }}"
    path: "{{ lifeos_config_root }}/LIFEOS/MEMORY/{{ item }}"
    state: link
    force: true
  loop:
    - KNOWLEDGE
    - LEARNING
    - WORK
  tags: [lifeos, pai]

# Core: skill library + LIFEOS runtime + dependencies
- name: deploy lifeos core
  command: bun Tools/DeployCore.ts --apply
  args:
    chdir: "{{ lifeos_payload }}"
  register: lifeos_deploy_core
  changed_when: (lifeos_deploy_core.stdout | from_json).skillsCopied | int > 0
    or (lifeos_deploy_core.stdout | from_json).runtimeCopied | int > 0
  tags: [lifeos, pai]

# Personal tree, kept outside this repo at {{ lifeos_config_dir }}/USER
- name: scaffold user tree
  command: bun Tools/ScaffoldUser.ts --apply --config-dir {{ lifeos_config_dir }}
  args:
    chdir: "{{ lifeos_payload }}"
  register: lifeos_scaffold_user
  changed_when: (lifeos_scaffold_user.stdout | from_json).copied | int > 0
  tags: [lifeos, pai]

- name: link user tree into config root
  command: bun Tools/LinkUser.ts --apply --config-dir {{ lifeos_config_dir }}
  args:
    chdir: "{{ lifeos_payload }}"
  register: lifeos_link_user
  changed_when: (lifeos_link_user.stdout | from_json).action != 'already-linked'
  tags: [lifeos, pai]

# Secrets: one age-encrypted blob lives in the notebook repo, encrypted TO the
# same ed25519 SSH key that clones it, so a new machine needs no extra key
# material. Nothing to paste, nothing to remember.
#
# To rotate or add a key, edit ~/.claude/.env then re-encrypt:
#   age -R ~/.ssh/id_ed25519.pub \
#       -o ~/Projects/notebook/lifeos/secrets/env.age ~/.claude/.env
#
# `creates:` makes the decrypt a no-op once ~/.claude/.env exists, so a live env
# file is never clobbered. Delete it to force a fresh pull from the repo.
- name: stat encrypted lifeos env
  stat:
    path: "{{ lifeos_config_dir }}/secrets/env.age"
  register: lifeos_env_age
  tags: [lifeos, pai]

- name: decrypt lifeos env
  command: >-
    age -d -i {{ ansible_env.HOME }}/.ssh/id_ed25519
    -o {{ lifeos_config_root }}/.env
    {{ lifeos_config_dir }}/secrets/env.age
  args:
    creates: "{{ lifeos_config_root }}/.env"
  when: lifeos_env_age.stat.exists
  tags: [lifeos, pai]

- name: restrict lifeos env permissions
  file:
    path: "{{ lifeos_config_root }}/.env"
    state: file
    mode: '0600'
  when: lifeos_env_age.stat.exists
  tags: [lifeos, pai]

# Routing table. copy/force=no so a customised CLAUDE.md is never clobbered.
- name: install claude.md routing table
  copy:
    src: "{{ lifeos_payload }}/install/CLAUDE.template.md"
    dest: "{{ lifeos_config_root }}/CLAUDE.md"
    force: false
    mode: '0644'
  tags: [lifeos, pai]

# Uncomments the identity @-imports, each guarded by existsSync of its target
- name: activate identity imports
  command: bun Tools/ActivateImports.ts --apply
  args:
    chdir: "{{ lifeos_payload }}"
  register: lifeos_activate_imports
  changed_when: (lifeos_activate_imports.stdout | from_json).activated | length > 0
  tags: [lifeos, pai]

# Merges the hook set into settings.json, backing it up first. This is what
# lights up the always-on behaviour (response format, memory loop, context
# injection). Note we no longer symlink this repo's claude/settings.json over
# it — that file is stale PAI-era config and would clobber live harness
# settings (enabled plugins, marketplaces, TUI prefs).
- name: install hooks
  command: bun Tools/InstallHooks.ts --apply
  args:
    chdir: "{{ lifeos_payload }}"
  register: lifeos_install_hooks
  changed_when: (lifeos_install_hooks.stdout | from_json).added | int > 0
  tags: [lifeos, pai]

# Custom slash commands layered alongside the LifeOS ones
- name: find custom claude commands
  find:
    paths: "{{ ansible_env.PWD }}/claude/commands"
    patterns: "*.md"
  register: lifeos_custom_commands
  tags: [lifeos, pai]

- name: link custom claude commands
  file:
    src: "{{ item.path }}"
    path: "{{ lifeos_config_root }}/commands/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ lifeos_custom_commands.files }}"
  tags: [lifeos, pai]

# Custom skills, one link per skill so LifeOS-deployed skills stay untouched
- name: find custom claude skills
  find:
    paths: "{{ ansible_env.PWD }}/claude/skills"
    file_type: directory
  register: lifeos_custom_skills
  tags: [lifeos, pai]

- name: link custom claude skills
  file:
    src: "{{ item.path }}"
    path: "{{ lifeos_config_root }}/skills/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ lifeos_custom_skills.files }}"
  tags: [lifeos, pai]
