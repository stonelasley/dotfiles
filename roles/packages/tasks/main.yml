---
- name: load package manifest
  include_vars:
    file: '{{ playbook_dir }}/packages.yml'
    name: manifest

- name: derive per-manager package lists from manifest
  set_fact:
    packages_apt: "{{ manifest | dict2items | map(attribute='value') | selectattr('apt', 'defined') | map(attribute='apt') | list }}"
    packages_brew: "{{ manifest | dict2items | map(attribute='value') | selectattr('brew', 'defined') | map(attribute='brew') | list }}"
    packages_pip: "{{ manifest | dict2items | map(attribute='value') | selectattr('pip', 'defined') | map(attribute='pip') | list }}"
    packages_npm: "{{ manifest | dict2items | map(attribute='value') | selectattr('npm', 'defined') | map(attribute='npm') | list }}"

# `apt: deb: <url>` re-downloads the .deb on every run before it can decide the
# package is already installed. Caching the file first makes the repeat cost a
# stat instead of a download (get_url skips when dest already exists).
- name: create deb cache directory
  file:
    path: '{{ ansible_env.HOME }}/.cache/dotfiles/debs'
    state: directory
    mode: '0755'
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: cache .deb downloads
  get_url:
    url: '{{ item }}'
    dest: "{{ ansible_env.HOME }}/.cache/dotfiles/debs/{{ item | basename }}"
    mode: '0644'
  loop: '{{ packages_debs }}'
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: install packages from file
  apt:
    deb: "{{ ansible_env.HOME }}/.cache/dotfiles/debs/{{ item | basename }}"
    update_cache: false
  become: true
  with_items:
    - '{{ packages_debs }}'
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: install apt packages
  apt:
    name: '{{ packages_apt }}'
    update_cache: true
    # install.sh already ran `apt update` minutes ago on a fresh box; without
    # this every run re-fetches every repo index before installing nothing.
    cache_valid_time: 3600
    state: present
  become: true
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: install brew packages
  shell:
  args:
    cmd: 'brew install {{ item }}'
  with_items:
    - '{{ packages_brew }}'
  when: ansible_distribution == 'MacOSX'

- name: Install PyPi packages
  pip:
    name: '{{ packages_pip }}'
    executable: pip3
    extra_args: --disable-pip-version-check

- name: Install NVM
  shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
  args:
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"

- name: Install latest LTS Node.js via NVM
  shell: |
    source {{ ansible_env.HOME }}/.nvm/nvm.sh
    nvm install --lts
    nvm alias default lts/*
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.nvm/versions/node"

# Without a presence check this reinstalls every global package on every run.
# @anthropic-ai/claude-code alone is a multi-minute install.
- name: list global npm packages
  shell: |
    source {{ ansible_env.HOME }}/.nvm/nvm.sh
    npm ls -g --depth=0 --parseable
  args:
    executable: /bin/bash
  register: packages_npm_installed
  changed_when: false
  failed_when: false

- name: Install npm packages globally
  shell: |
    source {{ ansible_env.HOME }}/.nvm/nvm.sh
    npm install -g {{ item }}
  args:
    executable: /bin/bash
  when: packages_npm_installed.stdout_lines
    | select('search', '/node_modules/' + (item | regex_escape) + '$')
    | list | length == 0
  with_items:
    - '{{ packages_npm }}'
