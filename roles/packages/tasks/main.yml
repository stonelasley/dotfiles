---
- name: load package manifest
  include_vars:
    file: '{{ playbook_dir }}/packages.yml'
    name: manifest

- name: derive per-manager package lists from manifest
  set_fact:
    apt_packages: "{{ manifest | dict2items | map(attribute='value') | selectattr('apt', 'defined') | map(attribute='apt') | list }}"
    brew_packages: "{{ manifest | dict2items | map(attribute='value') | selectattr('brew', 'defined') | map(attribute='brew') | list }}"
    pip_packages: "{{ manifest | dict2items | map(attribute='value') | selectattr('pip', 'defined') | map(attribute='pip') | list }}"
    npm_packages: "{{ manifest | dict2items | map(attribute='value') | selectattr('npm', 'defined') | map(attribute='npm') | list }}"

- name: install packages from file
  apt:
    deb: '{{ item }}'
    update_cache: false
  become: true
  with_items:
    - '{{ debs }}'
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: install apt packages
  apt:
    name: '{{ apt_packages }}'
    update_cache: true
    state: present
  become: true
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: install brew packages
  shell:
  args:
    cmd: 'brew install {{ item }}'
  with_items:
    - '{{ brew_packages }}'
  when: ansible_distribution == 'MacOSX'

- name: Install PyPi packages
  pip:
    name: '{{ pip_packages }}'
    executable: pip3

- name: Install NVM
  shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
  args:
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"

- name: Install latest LTS Node.js via NVM
  shell: |
    source {{ ansible_env.HOME }}/.nvm/nvm.sh
    nvm install --lts
    nvm alias default lts/*
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.nvm/versions/node"

- name: Install npm packages globally
  shell: |
    source {{ ansible_env.HOME }}/.nvm/nvm.sh
    npm install -g {{ item }}
  args:
    executable: /bin/bash
  with_items:
    - '{{ npm_packages }}'
